name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_model_eval:
        description: "Also run the evaluation against the real model (needs the OPENAI_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src eval tests scripts
      - name: Tests (no network, no API key)
        run: pytest

  eval-gate:
    # Deterministic regression gate: retrieval metrics, answer groundedness and the adversarial suite must not regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m eval.run --mode offline --gate --no-write | tee offline-eval.md
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-eval-report
          path: offline-eval.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t getnet-multi-agent-support:ci .
      - name: Image must not run as root
        run: test "$(docker run --rm getnet-multi-agent-support:ci id -u)" != "0"
      - name: Boot with a read-only filesystem and wait for readiness
        run: |
          docker run -d --name api --read-only --tmpfs /tmp -p 8000:8000 -e LLM_PROVIDER=offline getnet-multi-agent-support:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ready && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Smoke test the challenge contract
        run: |
          curl -fsS -X POST http://localhost:8000/chat -H "Content-Type: application/json" \
            -d "{\"message\": \"How many installments can I split a sale into with the crediario?\", \"user_id\": \"cliente1988\"}" | grep -q "48"

  model-eval:
    # Semantic evaluation with the real model and the LLM judge. Manual, because it costs tokens.
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m eval.run --gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-eval-report
          path: eval/reports/openai/
