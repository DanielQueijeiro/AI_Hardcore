services:
  api:
    build: .
    image: getnet-multi-agent-support:0.2.0
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_DB_PATH: /app/state/support.db
      CHECKPOINT_DB_PATH: /app/state/checkpoints.db
    volumes:
      - state:/app/state # conversations, tickets, traces: survives restarts and image upgrades
    read_only: true # the image is immutable; only the state volume and /tmp are writable
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  state:
